# Nginx : sert l'application Angular et relaie l'API / la WebSocket vers le
# conteneur backend. Même origine pour le navigateur => pas de CORS en prod.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Résolution DNS dynamique de "backend" via le DNS interne de Docker : avec une
    # variable dans proxy_pass, Nginx re-résout le nom (valid=10s) au lieu de figer
    # l'IP au démarrage, ce qui évite des 502 après recréation du conteneur backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8081;

    # Pièces jointes / requêtes volumineuses (défaut Nginx : 1m).
    client_max_body_size 10m;

    # API REST : proxy_pass sans chemin => l'URI d'origine (/api/..., query) est conservée.
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket des notifications : l'URI est conservée, y compris ?token=.
    location /ws/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Connexion longue durée : éviter la coupure après 60s d'inactivité.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Santé publique (inclut la base). Seul /actuator/health est exposé, via /healthz ;
    # /actuator/* n'est volontairement pas relayé.
    location = /healthz {
        proxy_pass http://$backend_upstream/actuator/health;
        access_log off;
    }

    # Fichiers d'entrée et du service worker : toujours revalidés pour que les
    # mises à jour soient prises en compte immédiatement.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }

    # Ressources statiques hachées (outputHashing=all) : cache long.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Routage côté client : toute route inconnue renvoie index.html (F5 sur une route profonde).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
