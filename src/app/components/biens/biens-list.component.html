<h1>Biens : {{ biens().length }}</h1>

@if (isLoading()) {
  <p>Chargement...</p>
} @else {
  <table>
    <thead>
      <tr>
        <th>Nom</th>
        <th>Adresse</th>
        <th>Ville</th>
        <th>Type</th>
        <th>Pièces</th>
      </tr>
    </thead>
    <tbody>
      @for (bien of biens(); track bien.id) {
        <tr>
          <td>{{ bien.nom }}</td>
          <td>{{ bien.adresse }}</td>
          <td>{{ bien.ville }}</td>
          <td>{{ bien.type }}</td>
          <td>{{ bien.nombrePieces ?? '—' }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5">Aucun bien pour l'instant.</td>
        </tr>
      }
    </tbody>
  </table>
}
