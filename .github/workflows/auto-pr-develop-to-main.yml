name: Auto PR develop -> main

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create PR develop -> main if none exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view develop --json url -q .url 2>/dev/null; then
            echo "A pull request from develop already exists, skipping."
          else
            gh pr create \
              --base main \
              --head develop \
              --title "Merge develop into main" \
              --body "Automatically opened by the auto-pr-develop-to-main workflow after a push to \`develop\`."
          fi
