name: CI

# Vérifie chaque PR vers develop : build de production + tests Vitest (jsdom, aucun navigateur à installer).
# Les workflows de PR et de Jira restent séparés.
on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:ci
